<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Contour. Videomarketing Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --border: rgba(255,255,255,0.08);
    --orange: #D03E00;
    --orange-light: #FF6321;
    --white: #F0EDE8;
    --muted: rgba(240,237,232,1);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --font-condensed: 'Barlow Condensed', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
    min-height: 100vh;
  }

  /* Custom cursor */
  .cursor {
    width: 8px; height: 8px;
    background: var(--orange);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s;
  }
  .cursor-follower {
    width: 32px; height: 32px;
    border: 1px solid rgba(200,84,26,0.4);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.18s ease;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 48px;
  }
  nav::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,10,10,0.95), transparent);
    pointer-events: none;
  }
  .nav-logo {
    text-decoration: none;
    position: relative;
    display: flex;
    align-items: center;
  }
  .nav-logo-img {
    height: 64px;
    width: auto;
    display: block;
  }

  /* PAGE LAYOUT */
  .page-wrap {
    min-height: 100vh;
    display: flex;
    align-items: stretch;
  }

  .form-left {
    width: 42%;
    background: var(--dark);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 64px;
  }

  .form-left::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 60%, rgba(200,84,26,0.12) 0%, transparent 65%),
      radial-gradient(ellipse at 80% 20%, rgba(200,84,26,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .form-left-logo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 76%;
    max-width: 400px;
    aspect-ratio: 1395 / 2408;
    background: url("project-assets/images/Contour_Element_Wit.png") center / contain no-repeat;
    opacity: 0.1;
    pointer-events: none;
  }

  .form-left-line {
    position: absolute;
    top: 0; left: 64px; bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--orange) 30%, var(--orange) 70%, transparent);
    opacity: 0.25;
  }

  .form-eyebrow {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 24px;
    position: relative;
  }

  .form-title {
    font-family: var(--font-display);
    font-size: clamp(30px, 3.4vw, 58px);
    line-height: 0.95;
    letter-spacing: 2px;
    color: var(--white);
    position: relative;
    margin-bottom: 32px;
  }

  .form-title em {
    font-family: var(--font-condensed);
    font-style: normal;
    font-size: 0.38em;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-top: 16px;
  }

  .form-sub {
    font-size: 15px;
    line-height: 1.7;
    color: var(--muted);
    max-width: 340px;
    position: relative;
  }

  .form-contact-detail {
    margin-top: 48px;
    position: relative;
  }

  .form-contact-detail a {
    font-family: var(--font-condensed);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .form-contact-detail a:hover { color: var(--white); }

  .form-contact-detail a::before {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    background: var(--orange);
    flex-shrink: 0;
  }

  /* RIGHT PANEL */
  .form-right {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 100px 64px 80px;
  }

  .form-inner {
    width: 100%;
    max-width: 680px;
  }

  .form-divider {
    width: 40px;
    height: 1px;
    background: var(--orange);
    opacity: 0.4;
    margin-bottom: 40px;
  }

  /* FORMULIER */
  .form-right iframe { display: block; }

  .form-note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 18px;
  }
  .form-note a { color: var(--orange); }

  /* FILM GRAIN OVERLAY */
  .grain-overlay {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  @media (max-width: 900px) {
    .page-wrap { flex-direction: column; }
    .form-left {
      width: 100%;
      padding: 120px 32px 64px;
      min-height: 50vh;
    }
    .form-right { padding: 64px 32px 80px; }
    nav { padding: 24px 32px; }
    .nav-logo-img { height: 48px; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-follower" id="cursorFollower"></div>
<div class="grain-overlay"></div>

<nav>
  <a href="index.html" class="nav-logo"><img src="project-assets/images/Contour_Logo_Wit.png" alt="Contour. Videomarketing Agency" class="nav-logo-img"></a>
</nav>

<div class="page-wrap">

  <!-- LEFT PANEL -->
  <div class="form-left">
    <div class="form-left-line"></div>
    <div class="form-left-logo"></div>
    <div class="form-eyebrow">Videomarketing Agency · België</div>
    <h1 class="form-title">
      Klaar voor meer leads?<br>
      Plan een gesprek.
    </h1>
    <p class="form-sub">
      Hoe kunnen we je helpen? We nemen binnen 24 uur contact op voor een vrijblijvend introgesprek.
    </p>
    <div class="form-contact-detail">
      <a href="mailto:contact@contouragency.be">contact@contouragency.be</a>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="form-right">
    <div class="form-inner">

      <div class="form-divider"></div>

      <iframe
        src="https://api.leadconnectorhq.com/widget/form/ScQxUWAJyiEvNbYEN5Di"
        style="width:100%;height:674px;border:none;border-radius:8px"
        id="inline-ScQxUWAJyiEvNbYEN5Di"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Form 0"
        data-height="674"
        data-layout-iframe-id="inline-ScQxUWAJyiEvNbYEN5Di"
        data-form-id="ScQxUWAJyiEvNbYEN5Di"
        data-cookie-consent="true"
        data-cookie-consent-provider="auto"
        title="Form 0"></iframe>

      <p class="form-note">Liever meteen mailen? <a href="mailto:contact@contouragency.be">contact@contouragency.be</a></p>

    </div>
  </div>

</div>

<script src="https://link.msgsndr.com/js/form_embed.js"></script>
<script>
// Vangnet: het embed-script houdt de iframe verborgen tot het formulier zich meldt.
// Blijft dat signaal uit, dan tonen we hem alsnog zodat de pagina nooit leeg blijft.
(function () {
  var el = document.getElementById('inline-ScQxUWAJyiEvNbYEN5Di');
  if (!el) return;
  setTimeout(function () {
    var s = window.getComputedStyle(el);
    if (s.visibility === 'hidden' || s.opacity === '0' || el.style.left === '-9999px') {
      el.style.opacity = '1';
      el.style.visibility = 'visible';
      el.style.pointerEvents = 'auto';
      el.style.position = 'relative';
      el.style.left = '';
    }
  }, 3000);
})();
</script>

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  const follower = document.getElementById('cursorFollower');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    setTimeout(() => {
      follower.style.left = e.clientX + 'px';
      follower.style.top = e.clientY + 'px';
    }, 80);
  });
</script>

</body>
</html>
